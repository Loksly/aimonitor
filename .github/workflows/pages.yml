name: Deploy GitHub Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Node.js 24
      uses: actions/setup-node@v4
      with:
        node-version: 24

    - name: Install dependencies
      run: npm ci

    - name: Regenerate all preview PNGs
      run: npm run preview -- --all --out preview

    # Los docs se generan ANTES que la galería: la navegación se construye
    # listando docs/, así que la galería necesita saber qué páginas existen.
    - name: Render docs/*.md to HTML
      run: npm run docs

    - name: Generate Gallery HTML
      run: npm run gallery

    - name: Setup Pages
      uses: actions/configure-pages@v4

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: 'preview'

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
